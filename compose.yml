services:
  # PostgreSQL 18
  db:
    image: postgres:18
    container_name: testapi-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: testapi-pgadmin
    user: root
    entrypoint: /bin/sh
    command:
      - -c
      - |
        cp /pgpass_ro /tmp/pgpass
        chmod 600 /tmp/pgpass
        exec /entrypoint.sh
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_DISABLE_POSTFIX: "true"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass_ro:ro
      - ./pgadmin/config_local.py:/pgadmin4/config_local.py:ro
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

  # API (.NET)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: testapi-api
    volumes:
      - ./TestApi:/src
      - api_bin:/src/bin
      - api_obj:/src/obj
    ports:
      - "8090:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=testdb;Username=postgres;Password=postgres"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  api_bin:
  api_obj:

